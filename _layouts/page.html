---
layout: default
---
<main class="main" id="main">
	<div class="container container--narrow">
		<div class="page-header">
			<h1 class="page-header__title">{{ page.title }}</h1>
			{%- if page.description -%}
				<p class="hero__tagline">{{ page.description }}</p>
			{%- endif -%}
		</div>

		<div class="prose">
			{{ content }}
		</div>
	</div>
</main>
