name: Post Latest Blog from RSS to Bluesky

on:
  workflow_run:
    workflows:
      - "Deploy Jekyll site to Pages"
    types:
      - completed

  workflow_dispatch:
    inputs:
      skip_date_check:
        description: "Skip the date check and post anyway"
        required: false
        type: boolean
        default: false

env:
  RSS_FEED_URL: ${{ vars.RSS_FEED_URL || 'https://drink20.com/feed' }}
  # Bluesky's hard blob limit is 1,000,000 bytes. Leave headroom.
  MAX_THUMB_BYTES: "950000"

permissions:
  contents: write

jobs:
  fetch-and-post:
    runs-on: ubuntu-latest

    steps:
      # Initial delay so the Pages deploy has settled
      - name: Initial Delay
        run: sleep 30

      # Checkout repository to access posted URLs tracking
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Cache apt packages
      - name: Cache apt packages
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: libxml2-utils
          version: 1.0

      # Install required tools
      - name: Install xmllint
        run: |
          sudo apt-get update && sudo apt-get install -y libxml2-utils

      # Fetch the latest blog post from RSS feed
      - name: Fetch Latest Blog Post
        id: fetch_post
        run: |
          # Fetch RSS feed
          response=$(curl -s --max-time 30 "$RSS_FEED_URL")

          # Check if we got a response
          if [[ -z "$response" ]]; then
            echo "Error: Empty response from RSS feed. Exiting."
            exit 1
          fi

          # Detect feed type (Atom vs RSS)
          if echo "$response" | grep -q '<feed xmlns="http://www.w3.org/2005/Atom"'; then
            FEED_TYPE="atom"
          else
            FEED_TYPE="rss"
          fi

          # Parse based on feed type
          if [[ "$FEED_TYPE" == "atom" ]]; then
            # Atom uses <entry>, <summary>/<content>, link@href, <published>/<updated>
            description=$(echo "$response" | xmllint --xpath "string(//*[local-name()='entry'][1]/*[local-name()='summary'])" - 2>/dev/null || echo "")

            if [[ -z "$description" ]]; then
              description=$(echo "$response" | xmllint --xpath "string(//*[local-name()='entry'][1]/*[local-name()='content'])" - 2>/dev/null || echo "")
            fi

            title=$(echo "$response" | xmllint --xpath "string(//*[local-name()='entry'][1]/*[local-name()='title'])" - 2>/dev/null || echo "")
            url=$(echo "$response" | xmllint --xpath "string(//*[local-name()='entry'][1]/*[local-name()='link']/@href)" - 2>/dev/null || echo "")

            pub_date=$(echo "$response" | xmllint --xpath "string(//*[local-name()='entry'][1]/*[local-name()='published'])" - 2>/dev/null || echo "")
            if [[ -z "$pub_date" ]]; then
              pub_date=$(echo "$response" | xmllint --xpath "string(//*[local-name()='entry'][1]/*[local-name()='updated'])" - 2>/dev/null || echo "")
            fi
          else
            # RSS feed parsing
            description=$(echo "$response" | xmllint --xpath "string(//item[1]/description)" - 2>/dev/null || echo "")
            url=$(echo "$response" | xmllint --xpath "string(//item[1]/link)" - 2>/dev/null || echo "")
            pub_date=$(echo "$response" | xmllint --xpath "string(//item[1]/pubDate)" - 2>/dev/null || echo "")
            title=$(echo "$response" | xmllint --xpath "string(//item[1]/title)" - 2>/dev/null || echo "")

            # Retry ignoring namespaces
            if [[ -z "$title" ]] || [[ -z "$url" ]]; then
              description=$(echo "$response" | xmllint --xpath "string(//*[local-name()='item'][1]/*[local-name()='description'])" - 2>/dev/null || echo "")
              url=$(echo "$response" | xmllint --xpath "string(//*[local-name()='item'][1]/*[local-name()='link'])" - 2>/dev/null || echo "")
              pub_date=$(echo "$response" | xmllint --xpath "string(//*[local-name()='item'][1]/*[local-name()='pubDate'])" - 2>/dev/null || echo "")
              title=$(echo "$response" | xmllint --xpath "string(//*[local-name()='item'][1]/*[local-name()='title'])" - 2>/dev/null || echo "")
            fi

            # Fall back to content:encoded
            if [[ -z "$description" ]]; then
              echo "Trying content:encoded for description..."
              description=$(echo "$response" | xmllint --xpath "string(//*[local-name()='item'][1]/*[local-name()='encoded'])" - 2>/dev/null || echo "")
            fi
          fi

          # Strip HTML tags and collapse whitespace
          description=$(echo "$description" | sed 's/<[^>]*>//g' | sed 's/&[^;]*;//g' | tr -s ' ' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          title=$(echo "$title" | sed 's/<[^>]*>//g' | sed 's/&[^;]*;//g' | tr -s ' ' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')

          echo "Parsed Data - Title: $title, URL: $url, PubDate: $pub_date"

          if [[ -z "$title" ]] || [[ -z "$url" ]]; then
            echo "Error: Failed to parse title or URL from the feed."
            echo "Feed type: $FEED_TYPE"
            exit 1
          fi

          # Skip if we've already posted this URL
          POSTED_FILE=".github/bluesky-posted-urls.txt"
          if [[ -f "$POSTED_FILE" ]] && grep -Fxq "$url" "$POSTED_FILE"; then
            echo "Already posted to Bluesky: $url"
            echo "Exiting to prevent duplicate post."
            exit 0
          fi

          # Date check (unless overridden)
          if [[ "${{ inputs.skip_date_check }}" == "true" ]]; then
            echo "Skipping date check"
          else
            if [[ -n "$pub_date" ]]; then
              today=$(date -u +%Y-%m-%d)
              pub_date_parsed=$(date -d "$pub_date" -u +%Y-%m-%d 2>/dev/null || echo "PARSE_ERROR")

              if [[ "$pub_date_parsed" == "PARSE_ERROR" ]]; then
                echo "Warning: Could not parse publication date. Continuing anyway."
              elif [[ "$pub_date_parsed" != "$today" ]]; then
                echo "Post is not from today ($pub_date_parsed). Exiting."
                exit 0
              fi
            fi
          fi

          # Build the post text
          prefix="New post on Drink20.com! : "

          # Bluesky counts graphemes, but bytes are the safer bound here.
          # prefix (27) + space between title and url (1) = 28
          base_text_length=28
          url_length=${#url}
          max_title_length=$((300 - base_text_length - url_length - 3))

          if [[ ${#title} -gt $max_title_length ]]; then
            echo "Truncating title to fit 300 character limit..."
            title="${title:0:$max_title_length}..."
          fi

          preview="${prefix}${title} ${url}"
          echo "Post length: ${#preview}"

          # Export via multiline-safe heredoc syntax
          {
            echo "preview<<POST_EOF"
            echo "$preview"
            echo "POST_EOF"
            echo "rss_url=$url"
          } >> "$GITHUB_OUTPUT"

          echo "Ready to post: $title"

      # Check whether the live page's og:image will fit Bluesky's blob limit.
      # The bluesky-post action downloads this image from the deployed site,
      # NOT from the repo checkout, so this has to be measured over the network.
      - name: Check og:image size
        id: og_check
        if: steps.fetch_post.outputs.rss_url != ''
        run: |
          post_url="${{ steps.fetch_post.outputs.rss_url }}"
          page=$(curl -sL --max-time 30 "$post_url" || echo "")

          if [[ -z "$page" ]]; then
            echo "Could not fetch post page. Falling back to plain text."
            echo "card=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Split tags onto their own lines, then pull the og:image content value
          og=$(printf '%s' "$page" \
            | sed 's/>/>\n/g' \
            | grep -i 'property="og:image"' \
            | grep -oP 'content="\K[^"]+' \
            | head -1 || echo "")

          if [[ -z "$og" ]]; then
            echo "No og:image found on the page. Posting without a card."
            echo "card=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Resolve a root-relative og:image against the site origin
          if [[ "$og" == /* ]]; then
            origin=$(printf '%s' "$post_url" | grep -oP '^https?://[^/]+' || echo "")
            og="${origin}${og}"
          fi

          echo "og:image = $og"

          # Prefer a HEAD request; fall back to downloading if no Content-Length
          size=$(curl -sIL --max-time 30 "$og" \
            | awk 'tolower($1) == "content-length:" { print $2 }' \
            | tr -d '\r' | tail -1 || echo "")

          if [[ ! "$size" =~ ^[0-9]+$ ]]; then
            echo "No Content-Length header, downloading to measure..."
            if curl -sL --max-time 60 -o /tmp/og_image "$og"; then
              size=$(stat -c%s /tmp/og_image)
            else
              size=""
            fi
          fi

          if [[ ! "$size" =~ ^[0-9]+$ ]]; then
            echo "Could not determine og:image size. Posting without a card to be safe."
            echo "card=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "og:image size: $size bytes (limit $MAX_THUMB_BYTES)"

          if (( size > MAX_THUMB_BYTES )); then
            echo "::warning::og:image is $size bytes, over the ${MAX_THUMB_BYTES} byte limit. Posting without a link card."
            echo "card=false" >> "$GITHUB_OUTPUT"
          else
            echo "card=true" >> "$GITHUB_OUTPUT"
          fi

          echo "og_image=$og" >> "$GITHUB_OUTPUT"
          echo "og_size=$size" >> "$GITHUB_OUTPUT"

      # Preferred path: post with the link preview card
      - name: Post to Bluesky (with link card)
        id: post_card
        if: steps.fetch_post.outputs.preview != '' && steps.og_check.outputs.card == 'true'
        continue-on-error: true
        uses: myConsciousness/bluesky-post@v5
        with:
          text: "${{ steps.fetch_post.outputs.preview }}"
          link-preview-url: "${{ steps.fetch_post.outputs.rss_url }}"
          identifier: ${{ secrets.BLUESKY_IDENTIFIER }}
          password: ${{ secrets.BLUESKY_PASSWORD }}

      # Fallback: plain text post. The URL is already in the text, so it still
      # renders as a clickable link, just without the image card.
      - name: Post to Bluesky (plain text fallback)
        id: post_plain
        if: >-
          steps.fetch_post.outputs.preview != '' &&
          (steps.og_check.outputs.card != 'true' || steps.post_card.outcome == 'failure')
        uses: myConsciousness/bluesky-post@v5
        with:
          text: "${{ steps.fetch_post.outputs.preview }}"
          identifier: ${{ secrets.BLUESKY_IDENTIFIER }}
          password: ${{ secrets.BLUESKY_PASSWORD }}

      # Track posted URL to prevent duplicates. Only runs if a post landed.
      - name: Record Posted URL
        id: record
        if: >-
          steps.post_card.outcome == 'success' ||
          steps.post_plain.outcome == 'success'
        run: |
          POSTED_FILE=".github/bluesky-posted-urls.txt"
          mkdir -p .github
          echo "${{ steps.fetch_post.outputs.rss_url }}" >> "$POSTED_FILE"

          # Keep only the last 100 URLs
          if [[ $(wc -l < "$POSTED_FILE") -gt 100 ]]; then
            tail -n 100 "$POSTED_FILE" > "$POSTED_FILE.tmp"
            mv "$POSTED_FILE.tmp" "$POSTED_FILE"
          fi

      # Commit the updated tracking file
      - name: Commit Posted URLs
        if: steps.record.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/bluesky-posted-urls.txt

          if ! git diff --staged --quiet; then
            git commit -m "Track posted URL"
            git push
          fi

      - name: Summary
        if: always()
        run: |
          echo "RSS Feed URL: $RSS_FEED_URL"
          echo "Post URL: ${{ steps.fetch_post.outputs.rss_url }}"
          echo "Preview Text: ${{ steps.fetch_post.outputs.preview }}"
          echo "og:image: ${{ steps.og_check.outputs.og_image }}"
          echo "og:image size: ${{ steps.og_check.outputs.og_size }}"
          echo "Card eligible: ${{ steps.og_check.outputs.card }}"
          echo "Card post outcome: ${{ steps.post_card.outcome }}"
          echo "Plain post outcome: ${{ steps.post_plain.outcome }}"