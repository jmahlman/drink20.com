# Drink20 Philly event calendar.
#
# Everything in this list is published two ways:
#   - /events      the human-readable page
#   - /events.ics  the subscribable calendar feed (webcal + Google + download)
#
# Fields
#   title     required. Shown as the calendar entry's name.
#   short     optional. A few words used in place of the title in the month
#             grid, where a cell is only so wide. Defaults to the title.
#   date      required. YYYY-MM-DD.
#   start     required. 24-hour HH:MM, local Philly time.
#   end       required. 24-hour HH:MM, local Philly time. Same night only —
#             nothing here runs past midnight.
#   location  optional but strongly preferred. Free text; calendar apps hand
#             this to their maps app, so "Venue, City, ST" works best.
#   link      optional. The Facebook event page. Becomes the entry's URL and
#             the "Facebook event" button on the page.
#   details   optional. One line of extra context (system being run, a
#             one-off change). Keep it short — it rides along in the feed.
#
# Adding an event is a one-line-per-field append; the feed rebuilds on push.
# Keep the list in date order, oldest first. Past events stay in the file:
# they drop off the top of the page on their own and give subscribers history.

