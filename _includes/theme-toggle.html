<button
	class="theme-toggle"
	type="button"
	data-theme-toggle
	aria-pressed="false"
	title="Switch between dark and light"
>
	<span class="visually-hidden">Switch to light mode</span>
	<svg class="theme-toggle__icon theme-toggle__icon--moon" viewBox="0 0 24 24" aria-hidden="true">
		<path
			fill="currentColor"
			d="M21.6 13.3A9 9 0 1 1 10.7 2.4a7.2 7.2 0 0 0 10.9 10.9Z"
		/>
	</svg>
	<svg class="theme-toggle__icon theme-toggle__icon--sun" viewBox="0 0 24 24" aria-hidden="true">
		<circle cx="12" cy="12" r="4.2" fill="currentColor" />
		<g stroke="currentColor" stroke-width="2" stroke-linecap="round">
			<path d="M12 1.8v2.6M12 19.6v2.6M4.2 4.2l1.9 1.9M17.9 17.9l1.9 1.9M1.8 12h2.6M19.6 12h2.6M4.2 19.8l1.9-1.9M17.9 6.1l1.9-1.9" />
		</g>
	</svg>
</button>
