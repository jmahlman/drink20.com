{%- comment -%}
Preview-only control for comparing skins. Disable by setting
`skin_switcher: false` in _config.yml — nothing else references it.
{%- endcomment -%}
<div class="skin-switcher" data-skin-switcher role="group" aria-label="Preview theme">
	<span class="skin-switcher__label">Skin</span>
	{%- assign skins = 'parchment,midnight,press' | split: ',' -%}
	{%- for skin in skins -%}
		<button
			class="skin-switcher__button"
			type="button"
			data-skin-value="{{ skin }}"
			aria-pressed="false"
		>{{ skin }}</button>
	{%- endfor -%}
</div>
