title: Drink20 Philly
description: Take a Drink and Roll Initiative
lang: en-US

url: https://drink20.com
paginate_path: "blog/page:num/"
permalink: blog/:title/

# --- Theme ------------------------------------------------------------------
# Skins live in _sass/_tokens.scss: parchment | midnight | press
default_skin: midnight
# Floating switcher for comparing skins in the browser. Set to false (or
# delete the _includes/skin-switcher.html + _sass/_skin-switcher.scss pair)
# once a skin is picked.
skin_switcher: true

sass:
    style: compressed

markdown: kramdown
highlighter: rouge
plugins:
- jekyll-paginate
- jekyll-feed
paginate: 10

exclude:
- Dockerfile
- docker-compose.yml
- package.json
- package-lock.json
- node_modules
- README.md

navigation:
    - title: Home
      url: /index.html
    - title: About
      url: /about
    - title: Current Breweries
      url: /breweries
    - title: Contact Us
      url: /contact
    - title: Code Of Conduct
      url: /CoC
    - title: FAQs
      url: /FAQ

social:
    facebook: drink20philly
    bluesky: drink20.bsky.social

google_analytics: "G-L3SCGD6NDM"
