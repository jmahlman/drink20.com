title: Drink20 Philly
description: Take a Drink and Roll Initiative
lang: en-US

url: https://drink20.com
paginate_path: "blog/page:num/"
permalink: blog/:title/

# Theme: dark by default, with a light mode behind the masthead toggle.
# Colours live in _sass/_tokens.scss.

sass:
    style: compressed

markdown: kramdown
highlighter: rouge
plugins:
- jekyll-paginate
- jekyll-feed
paginate: 10

exclude:
- assets/img/README.md
- Dockerfile
- docker-compose.yml
- package.json
- package-lock.json
- node_modules
- README.md

navigation:
    - title: Home
      url: /index.html
    - title: About
      url: /about
    - title: Current Breweries
      url: /breweries
    - title: Contact Us
      url: /contact
    - title: Code Of Conduct
      url: /CoC
    - title: FAQs
      url: /FAQ

social:
    facebook: drink20philly
    bluesky: drink20.bsky.social

google_analytics: "G-L3SCGD6NDM"
